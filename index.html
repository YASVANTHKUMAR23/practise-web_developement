<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>My Practice Site</h1>
    <nav>
      <a href="#counter">Counter</a>
      <a href="#todos">Todos</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <section class="practice" id="counter">
    <h2>Practice Notes</h2>
    <p>Learning HTML, CSS and JavaScript step by step.</p>
    <div class="counter">
      <button id="dec">-</button>
      <span id="count">0</span>
      <button id="inc">+</button>
      <button id="reset" title="Reset">Reset</button>
    </div>
  </section>
  <section class="todo" id="todos">
    <h2>My Todo List</h2>
    <input type="text" id="todo-input" placeholder="Enter a task" maxlength="60">
    <button id="todo-btn">Add</button>
    <ul id="todo-list"></ul>
    <p id="todo-count" class="todo-count">0 tasks</p>
  </section>

  <footer class="site-footer">
    <p id="about">Built while practising HTML, CSS and JavaScript. &copy; <span id="year"></span></p>
    <p id="clock"></p>
  </footer>
  <noscript>Please enable JavaScript to use this page.</noscript>
  <script src="script.js"></script>
</body>
</html>
