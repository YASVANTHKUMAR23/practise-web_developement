<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>My Practice Site</h1>
    <p id="greeting" class="greeting"></p>
    <nav>
      <a href="#counter">Counter</a>
      <a href="#todos">Todos</a>
      <a href="#contact">Contact</a>
      <a href="#about">About</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle">Dark mode</button>
  </header>
  <section class="practice" id="counter">
    <h2>Practice Notes</h2>
    <p>Learning HTML, CSS and JavaScript step by step.</p>
    <div class="counter">
      <button id="dec">-</button>
      <span id="count">0</span>
      <button id="inc">+</button>
      <button id="reset" title="Reset">Reset</button>
    </div>
  </section>
  <section class="todo" id="todos">
    <h2>My Todo List</h2>
    <input type="text" id="todo-input" placeholder="Enter a task" maxlength="60" aria-label="New task">
    <button id="todo-btn">Add</button>
    <p id="empty-msg" class="empty-msg">No tasks yet. Add one above!</p>
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Completed</button>
    </div>
    <ul id="todo-list"></ul>
    <p id="todo-count" class="todo-count">0 tasks</p>
    <button id="clear-done" class="clear-done">Clear completed</button>
  </section>

  <section class="contact" id="contact">
    <h2>Contact Form</h2>
    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <span class="error" id="name-error"></span>

      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <span class="error" id="email-error"></span>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" maxlength="200"></textarea>
      <span class="error" id="message-error"></span>
      <small id="char-count" class="char-count">0 / 200</small>

      <button type="submit">Send</button>
      <p id="form-status"></p>
    </form>
  </section>

  <section class="users" id="users">
    <h2>Sample Users</h2>
    <button id="load-users">Load users</button>
    <input type="text" id="user-search" placeholder="Search users">
    <p id="user-status" class="status"></p>
    <ul id="user-list"></ul>
  </section>

  <footer class="site-footer">
    <p id="about">Built while practising HTML, CSS and JavaScript. &copy; <span id="year"></span></p>
    <p id="clock"></p>
  </footer>
  <noscript>Please enable JavaScript to use this page.</noscript>
  <script src="script.js"></script>
</body>
</html>
